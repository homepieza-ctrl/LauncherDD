          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_FILE'
          <resources><string name="app_name">Launcher DD</string></resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.2.2' apply false
           id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include(":app")
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Aceptar licencias Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherDD-apk
          path: app/build/outputs/apk/debug/*.apk
